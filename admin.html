<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff Administration | EdiTech Solutions</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/img/editech-symbol.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/style.css" rel="stylesheet"></head><body><header class="site-nav"><div class="container nav-wrap d-flex align-items-center justify-content-between"><a class="brand-link" href="index.html"><img class="brand-icon" src="assets/img/editech-symbol.png" alt="" width="41" height="35"><span class="brand-text">Edi<span>Tech</span> Admin</span></a><a href="index.html" class="btn-outline-ed">Visit website</a></div></header><main class="container section-pad admin-shell" id="main"><div class="row justify-content-center"><div class="col-lg-11"><div class="kicker">Private workspace</div><h1 class="h2 mb-4">Administration</h1><div id="admin-alert" aria-live="polite"></div><section id="login-panel" class="info-card" style="max-width:520px"><h2 class="h4 mb-3">Staff sign in</h2><form id="login-form"><div class="mb-3"><label class="form-label" for="admin-email">Email</label><input class="form-control" type="email" id="admin-email" required autocomplete="username"></div><div class="mb-3"><label class="form-label" for="admin-password">Password</label><input class="form-control" type="password" id="admin-password" required autocomplete="current-password"></div><button type="submit" class="btn-ed">Sign in</button></form><p class="form-note mt-3 mb-0">Access is restricted to explicitly authorised EdiTech staff.</p></section><section id="admin-panel" hidden><div class="d-flex align-items-center justify-content-between gap-3 flex-wrap mb-4"><p id="signed-in-as" class="mb-0"></p><button class="btn-outline-ed" id="signout-button">Sign out</button></div><ul class="nav nav-tabs mb-4" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#enquiries-tab" type="button">Enquiries</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#projects-tab" type="button">Projects</button></li></ul><div class="tab-content"><div class="tab-pane fade show active" id="enquiries-tab"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3"><h2 class="h4">Received enquiries</h2><button class="btn-outline-ed" id="refresh-enquiries">Refresh</button></div><div class="table-responsive"><table class="table table-striped table-bordered admin-table"><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Service</th><th>Message</th><th>Status</th><th>Action</th></tr></thead><tbody id="enquiries-body"></tbody></table></div></div><div class="tab-pane fade" id="projects-tab"><h2 class="h4">Publish a verified project</h2><form id="project-form" class="row g-3 mb-5"><input type="hidden" id="project-id"><div class="col-md-6"><label class="form-label" for="project-title">Title</label><input class="form-control" id="project-title" minlength="3" maxlength="130" required></div><div class="col-md-6"><label class="form-label" for="project-category">Category</label><input class="form-control" id="project-category" minlength="2" maxlength="80" required placeholder="Website / Software / Network"></div><div class="col-12"><label class="form-label" for="project-summary">Summary</label><textarea class="form-control" id="project-summary" minlength="10" maxlength="1000" required rows="4"></textarea></div><div class="col-12"><label class="d-flex align-items-center gap-2"><input type="checkbox" id="project-published"> Published and approved for display</label></div><div class="col-12 d-flex gap-2 flex-wrap"><button class="btn-ed" type="submit">Save project</button><button class="btn-outline-ed" type="button" id="reset-project">Clear form</button></div></form><h2 class="h4">Projects</h2><div class="table-responsive"><table class="table table-bordered admin-table"><thead><tr><th>Title</th><th>Category</th><th>Published</th><th>Action</th></tr></thead><tbody id="projects-body"></tbody></table></div></div></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="assets/js/config.js" defer></script><script src="assets/js/admin.js" defer></script></body></html>
